apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: scimitar-backend-route
  namespace: exercises
spec:
  parentRefs:
    - name: scimitar-gateway
  rules:
    # Rule 1: /pingpong → rewrite prefix to /
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: scimitar-backend-svc
          namespace: exercises
          port: 80

    # Rule 2: /pings → rewrite prefix to /
    - matches:
        - path:
            type: PathPrefix
            value: /pings
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: scimitar-backend-svc
          namespace: exercises
          port: 80