apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: scimitar-combined-route
  namespace: exercises
spec:
  parentRefs:
    - name: scimitar-gateway
  rules:
    # More specific path first (order matters — evaluated top to bottom)
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
#      filters:
#        - type: URLRewrite
#          urlRewrite:
#            path:
#              type: ReplacePrefixMatch
#              replacePrefixMatch: /pingpong   # ← strip /pingpong → backend sees /
      backendRefs:
        - name: scimitar-backend-svc
          namespace: exercises
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /pings
      backendRefs:
        - name: scimitar-backend-svc
          namespace: exercises
          port: 80

    # Catch-all last
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: scimitar-app-svc
          port: 80