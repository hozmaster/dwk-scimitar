apiVersion: apps/v1
kind: Deployment
metadata:
  name: scimitar-backend
  namespace: exercises
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scimitar-app
      tier: backend
  template:
    metadata:
      labels:
        app: scimitar-app
        tier: backend
    spec:
      containers:
        - name: scimitar-backend
          image: matsubokkuri/scimitar-backend:1.14.10
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercise-config
                  key: db_host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: scimitar-secret
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scimitar-secret
                  key: db_password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: scimitar-secret
                  key: db_password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: db_name
                  name: exercise-config
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 20
            httpGet:
              port: 3010
              path: /healthZ
              scheme: HTTP
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 5
          livenessProbe:
            httpGet:
              port: 3010
              path: /healthZ
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 2